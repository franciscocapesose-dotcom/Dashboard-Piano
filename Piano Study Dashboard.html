<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Piano Study Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>

.bar{height:6px;background:var(--s2);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--au)}

.tag{font-size:11px;color:var(--mu);border:1px solid var(--ln);border-radius:10px;padding:0 7px}
.ra{display:flex;gap:4px;flex-wrap:wrap}
.clk{font:600 64px/1 'Cormorant Garamond',Georgia,serif;color:var(--au);margin:6px 0 14px}
.ch{width:100%;height:150px;display:block}

#toast{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:30;display:grid;gap:8px}
#toast div{background:var(--s2);border:1px solid var(--ok);border-radius:6px;padding:9px 14px}#toast .e{border-color:var(--er)}
.p-ok{color:var(--ok)}.p-wn{color:var(--wn)}.p-er{color:var(--er)}
@media(max-width:820px){
#app{grid-template-columns:1fr}

main{padding-bottom:96px}.week{grid-template-columns:1fr;overflow:visible}header h1{font-size:28px}}
main{max-width:1160px;margin:0 auto;width:100%}
header{margin-bottom:20px}header h1{font-size:30px}
.card{border:0;border-radius:10px;padding:18px 20px}
.card h2{font:600 14px 'Instrument Sans',system-ui,sans-serif;color:var(--mu);margin-bottom:14px}

.card.stat{background:none;padding:0;border-radius:0}.stat b{font-size:24px}
.key{height:130px}
th{font-size:12px}td .sm{border:0;background:none;color:var(--mu);padding:2px 6px}td .sm:hover{color:var(--tx)}td .sm.dng:hover{color:var(--er)}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:14px 0 16px}
.dc{border:1px solid var(--ln);background:var(--bg);border-radius:10px;padding:8px 2px;text-align:center}.dc b{display:block;font-size:18px;font-weight:600}.dc small{color:var(--mu);display:block}
.dc.on{border-color:var(--au);background:var(--s2)}.dc.td b{color:var(--au)}
.tl .tk{padding:12px 6px;gap:12px;align-items:center}.tl .tk:hover{background:var(--s2)}.tl .tb{cursor:pointer}.tm{width:42px;flex:none;color:var(--mu);font-size:12px}
.sum{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--mu);margin-bottom:8px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head>

<script>
const TZ='America/Sao_Paulo',$=(s,r=document)=>r.querySelector(s);

const f=(k,l,t='text',o)=>({k,l,t,o});
const E={
tasks:{n:'Tarefa',p:'Tarefas',req:['title','date'],f:[f('title','Título'),f('date','Data','date'),f('time','Início (opcional)','time'),f('min','Duração estimada (min)','number'),f('cat','Categoria','select',CATS),f('prio','Prioridade','select',['Baixa','Média','Alta']),f('status','Status','select',ST),f('pieceId','Peça','ref','pieces'),f('exId','Exercício','ref','exercises'),f('desc','Descrição','area'),f('notes','Observações','area'),f('rep','Repetir semanalmente (semanas extras)','number')]},
pieces:{n:'Peça',p:'Peças',req:['title'],cols:['title','composer','period','status','bpm','bpmT'],f:[f('title','Título'),f('composer','Compositor'),f('period','Período','select',['Barroco','Clássico','Romântico','Impressionista','Moderno','Contemporâneo','Outros']),f('key','Tonalidade'),f('level','Dificuldade (1–5)','number'),f('status','Status','select',PST),f('start','Data de início','date'),f('due','Previsão de conclusão','date'),f('bpm','BPM atual','number'),f('bpmT','BPM desejado','number'),f('desc','Descrição','area'),f('notes','Observações','area')],x:{h:'Progresso',v:p=>pbar(prog(p))}},
sessions:{n:'Sessão',p:'Sessões',req:['date','min'],cols:['date','time','min','cat','pieceId','taskId'],f:[f('date','Data','date'),f('time','Hora de início','time'),f('min','Duração (min)','number'),f('cat','Categoria','select',CATS),f('pieceId','Peça','ref','pieces'),f('exId','Exercício','ref','exercises'),f('taskId','Tarefa','ref','tasks'),f('notes','Observações','area')]},
exercises:{n:'Exercício',p:'Exercícios',req:['name'],cols:['name','cat','level','hands','key','bpmT'],f:[f('name','Nome'),f('cat','Categoria','select',['Escalas','Arpejos','Independência das mãos','Dedilhado','Velocidade','Precisão','Articulação','Dinâmica','Coordenação','Outros']),f('desc','Descrição','area'),f('level','Dificuldade (1–5)','number'),f('hands','Mãos','select',['Ambas','Direita','Esquerda']),f('key','Tonalidade'),f('bpm','BPM inicial','number'),f('bpmT','BPM desejado','number'),f('notes','Observações','area')],x:{h:'BPM atual',v:e=>curBpm(e)||'—'}},
records:{n:'Registro de evolução',p:'Registros de evolução',req:['exId','date','bpm'],cols:['date','exId','bpm','hands','diff'],f:[f('exId','Exercício','ref','exercises'),f('date','Data','date'),f('bpm','BPM alcançado','number'),f('hands','Mãos','select',['Ambas','Direita','Esquerda']),f('diff','Dificuldade percebida (1–5)','number'),f('notes','Observações','area')]},
topics:{n:'Tópico',p:'Tópicos de teoria',req:['title'],cols:['title','cat','status','last'],f:[f('title','Tópico'),f('cat','Categoria','select',TC),f('status','Status','select',['A estudar','Estudando','Estudado','Revisar']),f('last','Último estudo','date'),f('desc','Descrição','area'),f('notes','Anotações','area'),f('doubts','Dificuldades','area')]},
goals:{n:'Meta',p:'Metas',req:['title','target'],cols:['title','type','cat','due'],f:[f('title','Título'),f('type','Tipo','select',['Diária','Semanal','Mensal','Anual','Personalizada']),f('cat','Categoria','select',['Horas de estudo','Repertório','Técnica','Teoria','Leitura','Consistência','Outros']),f('metric','Cálculo do progresso','select',['Horas de estudo','Sessões','Tarefas concluídas','Manual']),f('start','Início','date'),f('due','Prazo','date'),f('target','Valor desejado','number'),f('unit','Unidade'),f('manual','Progresso manual (só no modo Manual)','number'),f('desc','Descrição','area')],x:{h:'Progresso',v:g=>{const p=gp(g)/(+g.target||1);return pbar(p)+`<small class="${p>=1?'p-ok':g.due&&g.due<today()?'p-er':''}">${Math.min(999,Math.round(p*100))}% ${p>=1?'concluída':g.due&&g.due<today()?'atrasada':''}</small>`}}},
journal:{n:'Registro',p:'Registros do diário',req:['title','date'],cols:['date','title','cat','pieceId'],f:[f('title','Título'),f('date','Data','date'),f('pieceId','Peça','ref','pieces'),f('sessId','Sessão','ref','sessions'),f('cat','Categoria','select',CATS),f('content','O que estudei, dificuldades, estratégias, o que melhorou, próxima sessão','area')]},
library:{n:'Material',p:'Materiais',req:['name'],cols:['name','author','type','cat','link'],f:[f('name','Nome'),f('author','Autor ou compositor'),f('type','Tipo','select',['Partitura','Livro','Apostila','PDF','Artigo','Link','Anotação','Outros']),f('cat','Categoria'),f('link','Link (https://…)','url'),f('pieceId','Peça','ref','pieces'),f('notes','Descrição','area')]}};
const DEF={tasks:()=>({date:today(),status:'Pendente',prio:'Média'}),sessions:()=>({date:today()}),pieces:()=>({status:'Planejada',start:today()}),records:()=>({date:today()}),journal:()=>({date:today()}),goals:()=>({start:today(),metric:'Horas de estudo'}),topics:()=>({status:'A estudar'}),exercises:()=>({}),library:()=>({})};
const blank=()=>({tasks:[],pieces:[],sessions:[],exercises:[],records:[],topics:[],goals:[],journal:[],library:[],timer:null});
let S=blank(),db=null,uid0=null,page=(location.hash.slice(1)||'dashboard'),wk=weekStart(today()),PF={},Q={},XE=null,AR=30,AG='Dia',st;
const lab=o=>o.title||o.name||'';
const sum=a=>a.reduce((t,x)=>t+(+x.min||0),0),inR=(d,a,b)=>d>=a&&d<=b;
const hoursIn=(a,b)=>sum(S.sessions.filter(x=>inR(x.date,a,b)));
const W={Planejada:0,Aprendendo:.4,'Em aperfeiçoamento':.75,Dominada:1,Arquivada:0};
const prog=p=>{if(p.status==='Dominada')return 1;let s=W[p.status]||0;if(+p.bpmT>0&&p.bpm!==''&&p.bpm!=null)s=(s+Math.min(1,p.bpm/p.bpmT))/2;return s};
const curBpm=e=>{const r=S.records.filter(x=>x.exId===e.id).sort((a,b)=>a.date<b.date?1:-1)[0];return r?r.bpm:(e.bpm||'')};
const gp=g=>{const a=g.start||'0000',b=g.due||'9999-12-31',ss=S.sessions.filter(x=>inR(x.date,a,b));
if(g.metric==='Horas de estudo')return sum(ss)/60;if(g.metric==='Sessões')return ss.length;

const pbar=p=>`<div class="bar"><i style="width:${Math.round(Math.max(0,Math.min(1,p))*100)}%"></i></div>`;
const IC={dashboard:'<path d="M3 3h7v9H3zM14 3h7v5h-7zM14 12h7v9h-7zM3 16h7v5H3z"/>',planner:'<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',repertoire:'<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>',sessions:'<circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M9 2h6"/>',technique:'<path d="M22 12h-4l-3 9L9 3l-3 9H2"/>',theory:'<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/>',goals:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',analytics:'<path d="M3 3v18h18M8 17v-5M13 17V8M18 17v-9"/>',journal:'<path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',library:'<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>'};
const NAV=[['Workspace',[['dashboard','Dashboard'],['planner','Weekly Planner'],['repertoire','Repertoire'],['sessions','Practice Sessions']]],['Development',[['technique','Technique Development'],['theory','Music Theory'],['goals','Goals & Objectives']]],['Tracking & resources',[['analytics','Study Analytics'],['journal','Practice Journal'],['library','Music Library']]]];
const TITLE={};NAV.forEach(g=>g[1].forEach(p=>TITLE[p[0]]=p[1]));
function save(){clearTimeout(st);st=setTimeout(async()=>{try{if(db)await db.doc('data/users/'+uid0+'/app').set({json:JSON.stringify(S)});else localStorage.setItem('psd',JSON.stringify(S))}catch(e){toast('Não foi possível salvar. Verifique a conexão e tente de novo.',1)}},300)}
function toast(m,e){const d=document.createElement('div');if(e)d.className='e';d.textContent=m;$('#toast').append(d);setTimeout(()=>d.remove(),3200)}
function modal(h,cb){$('#modal').innerHTML=`<div class="ov"><div class="dlg" role="dialog" aria-modal="true">${h}</div></div>`;const m=$('#modal');m.querySelectorAll('[data-x]').forEach(b=>b.onclick=close);m.querySelector('.ov').onclick=e=>{if(e.target.classList.contains('ov'))close()};cb&&cb(m);const i=m.querySelector('input,select,textarea');i&&i.focus()}

function form(ent,id,pre){const c=E[ent],it=id?S[ent].find(x=>x.id===id):pre;
const h=c.f.filter(x=>!(x.k==='rep'&&id)).map(x=>{const v=it[x.k]??'';let i;
if(x.t==='select')i=`<select name="${x.k}"><option value=""></option>${x.o.map(o=>`<option ${o==v?'selected':''}>${esc(o)}</option>`).join('')}</select>`;

if(id)Object.assign(it,o);else{S[ent].push({id:uid(),...o});if(n)for(let i=1;i<=n;i++)S[ent].push({id:uid(),...o,date:addD(o.date,7*i),status:'Pendente'})}

const ts=S.tasks.filter(x=>inR(x.date,wk,ds[6])),live=ts.filter(x=>x.status!=='Cancelada').length,done=ts.filter(x=>x.status==='Concluída').length;
const plan=sum(ts.filter(x=>x.status!=='Cancelada').map(x=>({min:x.min}))),real=sum(S.sessions.filter(s=>ts.some(x=>x.id===s.taskId)));
const vis=S.tasks.filter(x=>x.date===PD&&(!PF.cat||x.cat===PF.cat)&&(!PF.st||x.status===PF.st)).sort((a,b)=>(a.time||'99')>(b.time||'99')?1:-1);
return `<div class="card"><div class="bar2" style="margin:0"><button data-a="wk" data-i="-7" aria-label="Semana anterior">‹</button><b style="flex:1;text-align:center">${fmtD(wk)} a ${fmtD(ds[6])}</b><button data-a="wk" data-i="7" aria-label="Próxima semana">›</button><button data-a="wk" data-i="0">Hoje</button></div>
<div class="wk">${ds.map((d,i)=>{const l=S.tasks.filter(x=>x.date===d&&x.status!=='Cancelada'),n=l.filter(x=>x.status==='Concluída').length;return `<button class="dc ${d===PD?'on':''} ${d===t?'td':''}" data-a="pd" data-i="${d}" aria-label="${WL[i]} ${fmtD(d)}"><small>${DN[i]}</small><b>${d.slice(8)}</b><small>${l.length?n+'/'+l.length:'–'}</small></button>`}).join('')}</div>
<div class="sum"><span>${done} de ${live} tarefas concluídas</span><span>Planejado ${fmtH(plan)}</span><span>Realizado ${fmtH(real)}</span></div>${pbar(live?done/live:0)}</div>
<div class="card" style="margin-top:16px"><div class="bar2"><h3 style="flex:1;font-size:26px;min-width:160px">${WL[ds.indexOf(PD)]}, ${fmtD(PD)}</h3><select data-f="cat" aria-label="Categoria"><option value="">Categoria</option>${CATS.map(c=>`<option ${PF.cat===c?'selected':''}>${c}</option>`).join('')}</select><select data-f="st" aria-label="Status"><option value="">Status</option>${ST.map(c=>`<option ${PF.st===c?'selected':''}>${c}</option>`).join('')}</select><button class="pri" data-a="add" data-e="tasks" data-d="${PD}">Nova tarefa</button></div><div class="tl">${vis.length?vis.map(trow).join(''):empty('Nenhuma tarefa neste dia.')}</div></div>`};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a="pd"]');if(b){PD=b.dataset.i;render()}});
const form0=form;form=function(ent,id,pre){form0(ent,id,pre);if(ent==='tasks'&&id){const a=$('#modal .act');if(a){a.insertAdjacentHTML('afterbegin',`<button type="button" class="ghost dng" data-a="del" data-e="tasks" data-i="${id}" style="margin-right:auto">Excluir</button><button type="button" class="ghost" data-a="dup" data-i="${id}">Duplicar</button>`);a.querySelector('[data-a="dup"]').addEventListener('click',close)}}};
document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
window.addEventListener('hashchange',()=>{page=location.hash.slice(1)||'dashboard';render();scrollTo(0,0)});
setInterval(()=>{const c=$('#clk');if(c&&S.timer)c.textContent=clock(el(S.timer))},1000);
(async function init(){try{const C=window.claude;if(C){const u=await C.use('user');uid0=u?await u.id():null;db=uid0?await C.use('db'):null}}catch(e){db=null}
try{if(db){const s=await db.doc('data/users/'+uid0+'/app').get();if(s.exists)S={...blank(),...JSON.parse(s.data().json)}}else{const r=localStorage.getItem('psd');if(r)S={...blank(),...JSON.parse(r)}}}catch(e){toast('Não foi possível carregar os dados salvos.',1)}
render()})();
render();
</script></body></html>
